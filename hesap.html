<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hesabım · FarexHub</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><path d='M28 20h48v14H44v12h26v14H44v20H28z' fill='%23e10600'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<style>
  .hello { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 2rem; line-height: 1; }
  .hello span { color: var(--red); }
  dl { margin-top: .25rem; }
  .actions { display: grid; gap: .75rem; margin-top: .5rem; }
  .actions a.btn { text-align: center; text-decoration: none; }
</style>
</head>
<body>
<main>
  <a class="brand" href="index.html">Farexhub<span>.com</span></a>

  <div class="panel">
    <div class="body" id="box">
      <div class="msg" id="msg" role="status">Yükleniyor…</div>
    </div>
  </div>

  <a class="back" href="index.html">Ana sayfaya dön</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  const sb = window.sb;
  const box = document.getElementById('box');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  async function init() {
    if (!sb) {
      document.getElementById('msg').textContent = 'Supabase bağlantısı ayarlanmamış. config.js dosyasını doldur.';
      return;
    }
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return location.replace('giris.html');

    const user = session.user;
    let username = user.user_metadata && user.user_metadata.username;
    const { data: profile } = await sb.from('profiles').select('username, created_at').eq('id', user.id).maybeSingle();
    if (profile && profile.username) username = profile.username;

    const joined = new Date(user.created_at).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

    box.innerHTML = `
      <p class="hello">Hoş geldin, <span>${esc(username || 'oyuncu')}</span></p>
      <dl>
        <div class="row"><dt>Kullanıcı adı</dt><dd>${esc(username || '—')}</dd></div>
        <div class="row"><dt>E-posta</dt><dd>${esc(user.email)}</dd></div>
        <div class="row"><dt>Katılma tarihi</dt><dd>${esc(joined)}</dd></div>
      </dl>
      <div class="actions">
        <a class="btn" href="magaza.html">Mağazaya git</a>
        <button class="btn ghost" id="logout" type="button">Çıkış yap</button>
      </div>`;

    document.getElementById('logout').onclick = async () => {
      await sb.auth.signOut();
      location.replace('index.html');
    };
  }

  init();
  if (sb) sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') location.replace('giris.html'); });
</script>
</body>
</html>
