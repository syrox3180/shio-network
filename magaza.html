<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mağaza · FarexHub</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><path d='M28 20h48v14H44v12h26v14H44v20H28z' fill='%23e10600'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --black:#000; --red:#e10600; --red-deep:#7a0300; --ember:#ff3b1f; --bone:#f3ece8; --ash:#8c7f7b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background: radial-gradient(1200px 600px at 50% 120%, rgba(122,3,0,.55), transparent 70%), var(--black);
    color: var(--bone);
    font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
    display:grid; place-items:center; text-align:center; padding:2rem 1.25rem;
  }
  h1 {
    font-family:"Big Shoulders Display", Impact, sans-serif; font-weight:900;
    font-size:clamp(3rem, 12vw, 8rem); line-height:.85; text-transform:uppercase;
  }
  p { margin-top:1.25rem; color:var(--ash); font-size:1.1rem; }
  a {
    display:inline-block; margin-top:2rem; padding:.85rem 1.4rem;
    border:1px solid var(--red-deep); color:var(--bone); text-decoration:none; font-weight:600;
    transition:background .2s, color .2s;
  }
  a:hover { background:var(--red); color:var(--black); }
  :focus-visible { outline:2px solid var(--ember); outline-offset:3px; }
</style>
</head>
<body>
  <main>
    <h1>Mağaza</h1>
    <p>Ürünler çok yakında burada olacak.</p>
    <a href="index.html">Ana sayfaya dön</a>
  </main>
</body>
</html>
